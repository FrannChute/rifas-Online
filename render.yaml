services:
  - type: web
    name: rifas-online
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    preDeployCommand: npm run prisma:deploy
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: Club Sportivo Bolivar
      - key: APP_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: rifas-online-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: rifas-online-db
          property: connectionString
      - key: LOG_LEVEL
        value: info
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

databases:
  - name: rifas-online-db
    plan: free
